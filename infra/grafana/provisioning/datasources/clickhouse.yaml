apiVersion: 1

datasources:
  - name: StreamPulse ClickHouse
    uid: streampulse-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana_reader
      defaultDatabase: streampulse
      secure: false
      dialTimeout: 10
      queryTimeout: 30
      validateSql: true
    secureJsonData:
      password: ${GRAFANA_CH_PASSWORD}
