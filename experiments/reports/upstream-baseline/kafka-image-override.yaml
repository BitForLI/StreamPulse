# Reproducibility overlay for apache/flink-playgrounds commit 6115f8e6d083.
# The upstream bitnami/kafka:3.9.0 tag was unavailable on 2026-08-29.
# This substitutes Apache's official Kafka 3.9.0 image without modifying the
# upstream Compose file or any Flink/example-job configuration.
services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment: !override
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  client:
    depends_on:
      jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
  clickevent-generator:
    depends_on:
      kafka:
        condition: service_healthy
